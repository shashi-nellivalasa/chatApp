    <p-floatlabel>
      <input
        id="username"
        pInputText
        [(ngModel)]="signUpObject.userName"
        [class.p-filled]="!!signUpObject.userName"
        autocomplete="off"
      />
      <label for="username">Username</label>
    </p-floatlabel>
    <p-floatlabel>
      <input
        id="firstName"
        pInputText
        [(ngModel)]="signUpObject.firstName"
        [class.p-filled]="!!signUpObject.firstName"
        autocomplete="off"
      />
      <label for="firstName">First Name</label>
    </p-floatlabel>
    <p-floatlabel>
      <input
        id="lastName"
        pInputText
        [(ngModel)]="signUpObject.lastName"
        [class.p-filled]="!!signUpObject.lastName"
        autocomplete="off"
      />
      <label for="lastName">Last Name</label>
    </p-floatlabel>
    <p-floatlabel>
      <input
        id="email"
        pInputText
        [(ngModel)]="signUpObject.email"
        [class.p-filled]="!!signUpObject.email"
        autocomplete="off"
      />
      <label for="email">Email</label>
    </p-floatlabel>
    <p-floatlabel>
      <input
        id="password"
        pInputText
        type="password"
        [(ngModel)]="signUpObject.password"
        [class.p-filled]="!!signUpObject.password"
        autocomplete="off"
      />
      <label for="password">Password</label>
    </p-floatlabel>
    <p-floatlabel>
      <input
        id="confirmPassword"
        pInputText
        type="password"
        [(ngModel)]="signUpObject.confirmPassword"
        [class.p-filled]="!!signUpObject.confirmPassword"
        autocomplete="off"
      />
      <label for="confirmPassword">Confirm Password</label>
    </p-floatlabel>
    <p class="signIn-text">
      Already have an account?
      <br /><span class="text-primary" (click)="navToSignIn()">Sign In</span>
    </p>
    <div class="signUpButton">
      <button class="btn btn-success" (click)="signUp()">Sign Up</button>
    </div>
  </div>
</div>
