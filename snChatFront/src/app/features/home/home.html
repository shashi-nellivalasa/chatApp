<div class="main">
  <nav>
    <ul>
      <li>
        <a routerLink="chat-list" routerLinkActive="active"
          ><i class="fa-solid fa-envelope-open"></i
        ></a>
      </li>
      <li>
        <a routerLink="savedChats" routerLinkActive="active"
          ><i class="fa-solid fa-bookmark"></i
        ></a>
      </li>
      <li>
        <a routerLink="search" routerLinkActive="active"
          ><i class="fa-solid fa-magnifying-glass"></i
        ></a>
      </li>
      <li>
        <a routerLink="notifications" routerLinkActive="active"
          ><i class="fa-solid fa-bell"></i
        ></a>
      </li>
      <li>
        <a routerLink="account" routerLinkActive="active"
          ><i class="fa-solid fa-screwdriver-wrench"></i
        ></a>
      </li>
      <li (click)="signOut()">
        <i class="fa-solid fa-right-from-bracket" style="color: #ff7d7d"></i>
      </li>
    </ul>
  </nav>
  <div class="content">
    <router-outlet></router-outlet>
  </div>
</div>
