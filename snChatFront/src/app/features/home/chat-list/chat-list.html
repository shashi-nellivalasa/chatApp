<div class="chat-list-container">
  <div class="chat-left">
    <input placeholder="Search" id="Search" type="text" class="search" [(ngModel)]="search" />
    <div class="chats">
      @for (chat of chatlist; track $index) {
        <div class="chat" (click)="selectChat($index)">
          <div class="avatar-container">
            @if (chat.image) {
              <img [src]="chat.image" alt="DP" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #fff;" />
            } @else {
              <div style="width: 100%; height: 100%; border-radius: 50%; background-color: var(--secondary-color, #ddd); display: flex; align-items: center; justify-content: center;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#aaa" width="24" height="24">
                  <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z" />
                </svg>
              </div>
            }
            <span class="status-dot" [class.status-online]="chat.status === 'online'" [class.status-offline]="chat.status === 'offline'"></span>
          </div>
          <div class="chat-content">
            <h4>{{ chat.name }}</h4>
            <p>{{ chat.lastMessage }}</p>
          </div>
        </div>
      }
    </div>
  </div>
  <div class="open-chat">
    <app-conversation [selectedChat]="selectedChat"></app-conversation>
  </div>
</div>
