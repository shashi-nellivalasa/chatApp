<div class="conversation">
  <div class="chat-dashboard">
    <header>
      @if (selectedChat) {
        <h1>{{ selectedChat.name }}</h1>
      } @else {
        <h1>Select a chat</h1>
      }
    </header>
    <div class="chat-container">
      <div class="chats">
        <!-- Scrollable messages -->
        <div class="messages-area" #messagesArea>
          @for (msg of messages; track $index) {
            <div
              class="message"
              [style.align-self]="msg.sender?._id === currentUserId ? 'flex-end' : 'flex-start'"
              [style.background-color]="
                msg.sender?._id === currentUserId ? 'var(--accent-color, #007bff)' : '#f1f1f1'
              "
              [style.color]="msg.sender?._id === currentUserId ? 'white' : 'black'"
              style="padding: 0.5rem 1rem; border-radius: 15px; width: fit-content; max-width: 80%; cursor: context-menu;"
              (contextmenu)="onRightClick($event, msg)"
            >
              {{ msg.content }}
            </div>
          }
        </div>

        @if (showContextMenu) {
          <div
            class="context-menu"
            [style.top.px]="contextMenuY"
            [style.left.px]="contextMenuX"
            (click)="$event.stopPropagation()"
          >
            <ul>
              <li (click)="saveMsg()">Save Message</li>
            </ul>
          </div>
        }

        <!-- Input bar — stays at bottom of .chats flex column -->
        <div class="chat-input">
          <input
            type="text"
            [(ngModel)]="newMessage"
            placeholder="Type a message..."
            style="flex: 1; padding: 0.5rem; border-radius: 4px; border: 1px solid #ccc"
            (keydown.enter)="sendMessage()"
          />
          <button
            (click)="sendMessage()"
            style="
              padding: 0.5rem 1rem;
              border-radius: 4px;
              background-color: var(--accent-color);
              color: white;
              border: none;
              cursor: pointer;
            "
          >
            Send
          </button>
        </div>
      </div>
      <div class="info">
        @if (selectedChat) {
          <p>{{ selectedChat.name }}'s Info</p>
          @if (selectedChat.image) {
            <img
              [src]="selectedChat.image"
              style="
                width: 100px;
                height: 100px;
                border-radius: 50%;
                object-fit: cover;
                margin-top: 1rem;
              "
              loading="lazy"
            />
          }
        }
      </div>
    </div>
  </div>
</div>
